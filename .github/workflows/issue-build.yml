name: 이슈로 보고서 생성

# Issues → New issue → '보고서 생성 요청' 폼으로 본문을 붙여 넣으면 실행된다.
# 저장소 구성원이 연 이슈에만 반응한다(공개 저장소에서 남용 방지).

on:
  issues:
    types: [opened, edited]

permissions:
  contents: read
  issues: write

concurrency:
  group: issue-build-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  build:
    name: hwpx 생성
    if: >-
      startsWith(github.event.issue.title, '[보고서]') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 한글 글꼴 설치 (이미지 도식용)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-nanum
      - name: 설치
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[image]"
      - name: 이슈 본문 해석
        id: parse
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: python .github/scripts/issue_to_input.py
      - name: 생성
        id: build
        if: steps.parse.outputs.ok == 'true'
        env:
          INPUT_PATH: issue_input.md
          PROFILE: ${{ steps.parse.outputs.profile }}
          OUTPUT_NAME: ${{ steps.parse.outputs.output_name }}
          DIAGRAM_RENDER: ${{ steps.parse.outputs.diagram_render }}
          STRICT: ${{ steps.parse.outputs.strict }}
          PREVIEW: ${{ steps.parse.outputs.preview }}
          OUT_DIR: out
        run: python .github/scripts/run_build.py
      - uses: actions/upload-artifact@v4
        if: always() && hashFiles('out/*') != ''
        with:
          name: 보고서-이슈${{ github.event.issue.number }}
          path: out/
          retention-days: 14
      - name: 결과 댓글
        if: always()
        uses: actions/github-script@v7
        env:
          PARSE_OK: ${{ steps.parse.outputs.ok }}
          PARSE_REASON: ${{ steps.parse.outputs.reason }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          OUTPUT_NAME: ${{ steps.parse.outputs.output_name }}
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}` +
                           `/actions/runs/${context.runId}`;
            const ok = process.env.PARSE_OK === 'true';
            const outcome = process.env.BUILD_OUTCOME;
            let body;
            if (!ok) {
              body = `본문을 읽지 못했습니다: ${process.env.PARSE_REASON || '내용 없음'}\n\n` +
                     `이슈를 수정하면 다시 시도합니다.`;
            } else if (outcome === 'success') {
              body = `✅ **${process.env.OUTPUT_NAME}** 생성 완료\n\n` +
                     `- [실행 기록 열기](${runUrl}) → 페이지 아래 **Artifacts**에서 내려받으세요\n` +
                     `- 검사 결과와 경고는 실행 기록의 요약(Summary)에 정리돼 있습니다\n\n` +
                     `본문을 고치려면 이 이슈를 수정하세요. 저장하면 다시 만듭니다.`;
            } else {
              body = `❌ 생성에 실패했습니다.\n\n` +
                     `[실행 기록](${runUrl})의 요약에서 원인을 확인하세요. ` +
                     `본문 검사에서 걸린 경우라면 지적된 줄을 고치고 이슈를 수정하면 다시 시도합니다.`;
            }
            await github.rest.issues.createComment({
              ...context.repo, issue_number: context.issue.number, body,
            });
