name: 서식 추출

# 기존 한글 문서(.hwpx)를 저장소에 올린 뒤, 그 경로를 넣고 실행한다.
# 결과: 프로파일 JSON + 근거 리포트(요약에도 그대로 표시된다)

on:
  workflow_dispatch:
    inputs:
      source_path:
        description: "기준이 될 .hwpx 경로 (저장소 안)"
        required: true
        default: "prototypes/orgchart_table.hwpx"
        type: string
      profile_name:
        description: "만들 프로파일 이름"
        required: false
        default: "추출 프로파일"
        type: string

permissions:
  contents: read

jobs:
  extract:
    name: 프로파일 역생성
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 설치
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: 추출
        env:
          SOURCE_PATH: ${{ inputs.source_path }}
          PROFILE_NAME: ${{ inputs.profile_name }}
          OUT_DIR: out
        run: python .github/scripts/run_extract.py
      - uses: actions/upload-artifact@v4
        if: always() && hashFiles('out/*') != ''
        with:
          name: 추출-프로파일
          path: out/
          retention-days: 14
