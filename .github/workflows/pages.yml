name: 웹 앱 배포 (GitHub Pages)

# docs/ 를 GitHub Pages로 배포한다.
# Pages가 꺼져 있으면 configure-pages가 켠다(enablement: true).

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: 배포
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 자산이 최신인지 검사
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          python tools/build_web.py --check
      - uses: actions/configure-pages@v5
        with:
          enablement: true      # Pages가 꺼져 있으면 이 워크플로가 켠다
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
