name: 도식 가져오기

# Actions 탭 → '도식 가져오기' → [Run workflow].
# 저장소에 올려 둔 Mermaid·SVG·HTML 파일을 읽어 도식 블록과 한글 문서로 만든다.
# 붙여 넣기로 바로 해 보려면 웹 앱(docs/index.html)의 '도식 가져오기' 칸이 빠르다.

on:
  workflow_dispatch:
    inputs:
      source_path:
        description: "원본 파일 경로 (저장소 안: .mmd / .svg / .html / .md)"
        required: true
        default: "examples/capture/org.mmd"
        type: string
      title:
        description: "도식 제목 (표 아래에 붙는다)"
        required: false
        default: ""
        type: string
      kind:
        description: "원본 형식"
        required: false
        default: "auto"
        type: choice
        options: ["auto", "mermaid", "svg", "html"]
      profile:
        description: "서식 프로파일"
        required: true
        default: "policy-default"
        type: choice
        options: ["policy-default", "gov-3level", "narrative"]
      output_name:
        description: "결과 파일 이름"
        required: false
        default: "도식.hwpx"
        type: string

permissions:
  contents: read

jobs:
  capture:
    name: 도식 읽어 hwpx 생성
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 설치
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: 가져오기
        env:
          SOURCE_PATH: ${{ inputs.source_path }}
          TITLE: ${{ inputs.title }}
          KIND: ${{ inputs.kind }}
          PROFILE: ${{ inputs.profile }}
          OUTPUT_NAME: ${{ inputs.output_name }}
          OUT_DIR: out
        run: python .github/scripts/run_capture.py
      - uses: actions/upload-artifact@v4
        if: always() && hashFiles('out/*') != ''
        with:
          name: 가져온-도식
          path: out/
          retention-days: 14
